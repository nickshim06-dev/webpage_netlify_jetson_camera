<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mobile Friendly Website</title>
    <style>
        /* Modern CSS Reset & Styling */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 85%;
        }
        h1 {
            color: #111;
            margin-top: 0;
            font-size: 1.8rem;
        }
        p {
            color: #666;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .btn {
            background-color: #0070f3;
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0051a8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello from my Laptop! 👋</h1>
        <p>If you are reading this on your phone right now, your Netlify live deployment worked perfectly.</p>
        <a href="#" class="btn" onclick="alert('It works!')">Click Me</a>
    </div>

</body>
</html>
