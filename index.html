<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jetson Live Smart Security</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .video-box {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 15px;
            aspect-ratio: 16 / 9;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .badge {
            background-color: #cf6679;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Jetson Nano CCTV Feed <span class="badge">LIVE</span></h2>
        <p>AI Model: SSD-Mobilenet-v2 (Person Detection)</p>
        
        <div class="video-box">
            <!-- Native HTML5 Video Element for WebRTC stream processing -->
            <video id="jetson-video" autoplay muted playsinline controls></video>
        </div>
    </div>

    <!-- WebRTC Connection Script to link with jetson.utils stream directly -->
    <script>
        const videoElement = document.getElementById('jetson-video');
        
        // Construct the WebRTC stream URL from your public secure ngrok tunnel
        // NOTE: We change 'https://' to 'wss://' for secure WebRTC signaling data
        const ngrokHost = "charbroil-overtime-mothproof.ngrok-free.dev";
        const streamUrl = `wss://${ngrokHost}/mystream`;

        async function startWebRTC() {
            const pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:://google.com' }]
            });

            pc.ontrack = (event) => {
                if (videoElement.srcObject !== event.streams[0]) {
                    videoElement.srcObject = event.streams[0];
                }
            };

            // Setup internal WebSocket signalling with your Jetson's built-in WebRTC server
            const ws = new WebSocket(streamUrl);
            ws.onmessage = async (message) => {
                const data = JSON.parse(message.data);
                if (data.sdp) {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                    if (data.type === 'offer') {
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        ws.send(JSON.stringify(pc.localDescription));
                    }
                } else if (data.candidate) {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            };
        }

        // Start the link sequence automatically on page load
        startWebRTC().catch(console.error);
    </script>
</body>
</html>
