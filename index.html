<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jetson Live Smart Security</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .video-box {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 15px;
            aspect-ratio: 16 / 9;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .badge {
            background-color: #cf6679;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Jetson Nano CCTV Feed <span class="badge">LIVE</span></h2>
        <p>AI Model: SSD-Mobilenet-v2 (Person Detection)</p>
        
        <div class="video-box">
            <video id="jetson-video" autoplay muted playsinline controls></video>
        </div>
    </div>

    <script>
        const NGROK_HOST = "charbroil-overtime-mothproof.ngrok-free.dev";
        const STREAM_NAME = "mystream"; 
        
        const videoElement = document.getElementById('jetson-video');
        let pc = null;
        let ws = null;
        
        function startWebRTC() {
            pc = new RTCPeerConnection({});
        
            pc.ontrack = (event) => {
                console.log("Receiving live video tracks from Jetson Nano...");
                videoElement.srcObject = event.streams[0];
            };
        
            pc.addTransceiver('video', { direction: 'recvonly' });
        
            // FIX: Using string joining ensures NGROK_HOST parses exactly right
            ws = new WebSocket("wss://" + NGROK_HOST + "/");
        
            ws.onopen = async () => {
                console.log("Connected to Jetson signaling system. Negotiating stream channel...");
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                
                // FIX: Field names matched to NVIDIA's jetson-inference expectation
                ws.send(JSON.stringify({
                    command: "request",
                    stream_id: STREAM_NAME,
                    sdp: pc.localDescription.sdp,
                    type: pc.localDescription.type
                }));
            };
        
            ws.onmessage = async (message) => {
                const data = JSON.parse(message.data);
                
                if (data.sdp) {
                    console.log("Received video stream configurations. Rendering pipeline...");
                    await pc.setRemoteDescription(new RTCSessionDescription({
                        type: data.type,
                        sdp: data.sdp
                    }));
                } else if (data.candidate) {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            };
        
            ws.onerror = (error) => console.error("WebSocket Signaling Pipeline Error:", error);
            ws.onclose = () => console.log("Signaling socket channel successfully closed.");
        }
        
        window.onload = startWebRTC;
    </script>
</body>
</html>
