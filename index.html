<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jetson Live Smart Security</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .video-box {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 15px;
            aspect-ratio: 16 / 9;
        }
        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
        }
        .badge {
            background-color: #cf6679;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Jetson Nano CCTV Feed <span class="badge">LIVE</span></h2>
        <p>AI Model: SSD-Mobilenet-v2 (Person Detection)</p>
        
        <div class="video-box">
            <!-- Replace with your public Ngrok URL pointing to the Jetson's stream webpage -->
            <iframe src="https://ngrok-free.dev" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
